# pyproject.toml
# ================================
# Python project configuration for uv + setuptools
# Works as the "global docstring" of the project
# ================================

[project]
name = "cbc-population-distributions"
authors = [{name = "R. Weizmann Kiendrebeogo", email = "kiend.weizman7@gmail.com"}]
version = "0.1.0"
requires-python = ">=3.11"


# Main dependencies
dependencies = [
    "ligo.skymap>=2.5.2",
    "gwpopulation[jax]>=1.2.1",
    "popsummary",
    "gracedb-sdk",
    "lxml",
    "gwpy[astro]",
    "ipython",
    "pre-commit>=4.3.0",
    "pybtex>=0.25.1",
    "pytest-astropy[test]>=0.11.0",
    "ruff>=0.13.1",
    "seaborn>=0.13.2",
    "sphinx[docs]>=8.2.3",
    "scikits-bootstrap>=1.1.1",
]

# CLI entry point
[project.scripts]
cbc-sample = "cbc_population_distributions.population_driver:main"

# Tell uv this is a package
[tool.uv]
package = true


[project.optional-dependencies]
test = [
    "astroplan",
    "networkx",
    "pytest-astropy",
]
docs = [
    "pysiaf",
    "sphinx-astropy[confv2]",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-typer",
    "sphinx-automodapi",
    "sphinx-thebe",
    "sphinx-design",
    "jupyter-sphinx",
    "ipykernel",
    "nbsphinx",
    "sphinx-gallery",
    "ipython",
    "ipykernel",
    "jupyter_client",
    "nbconvert",
    "sphinx",
    "numpydoc",
    "graphviz",
    "joblib",
    "dask",
    "ligo.skymap >= 2.4.0",
    "python-ligo-lw",
    "igwn-ligolw",
    "memory-profiler"
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
    "docs",
]
norecursedirs = [
    "_build",
]
astropy_header = true
doctest_plus = "enabled"
text_file_format = "rst"
addopts = [
    "--doctest-rst",
    "--ignore=docs/_build",
]
doctest_optionflags = [
    "FLOAT_CMP",
    "IGNORE_EXCEPTION_DETAIL",
]

[tool.coverage.run]
omit = [
    "src/cbc_population_distributions/*setup_package*",
    "*/cbc_population_distributions/*setup_package*",
]

[tool.coverage.report]
exclude_also = [
    # Don't complain about packages we have installed
    "except ImportError",
    # Don't complain if tests don't hit assertions
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain about script hooks
    "def main\\(.*\\):",
    # Ignore branches that don't pertain to this version of Python
    "pragma: py{ignore_python_version}",
    # Don't complain about IPython completion helper
    "def _ipython_key_completions_",
]

# Build system (setuptools)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "nbconvert>=7.17.0",
    "nbformat>=5.10.4",
    "pre-commit>=4.3.0",
]

# Package discovery: src/ layout (see PLAN_REORG.md) -- look inside src/,
# not the repo root, for cbc_population_distributions.
[tool.setuptools.packages.find]
where = ["src"]
include = ["cbc_population_distributions*"]
